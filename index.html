<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>超级打砖块</title>
<style>
:root{
    color-scheme:dark;
    --panel:#0f172a;
    --ink:#eef6ff;
    --muted:#a8c2d8;
    --line:#22364d;
    --green:#36d399;
    --cyan:#38bdf8;
    --pink:#fb7185;
    --gold:#facc15;
}
*{box-sizing:border-box}
body{
    margin:0;
    min-height:100vh;
    overflow:hidden;
    background:
        radial-gradient(circle at 20% 12%,#1e5f74 0 14%,transparent 34%),
        radial-gradient(circle at 86% 20%,#62385b 0 10%,transparent 32%),
        linear-gradient(135deg,#08111f,#111827 48%,#06131b);
    color:var(--ink);
    font-family:"Microsoft YaHei",Arial,sans-serif;
}
.shell{
    height:100vh;
    display:grid;
    grid-template-columns:minmax(230px,280px) minmax(0,1fr) minmax(220px,260px);
    gap:18px;
    padding:18px;
}
.panel{
    min-height:0;
    border:1px solid var(--line);
    background:rgba(9,16,29,.84);
    box-shadow:0 18px 60px rgba(0,0,0,.34);
    backdrop-filter:blur(16px);
    border-radius:8px;
}
.side{
    padding:18px;
    display:flex;
    flex-direction:column;
    gap:16px;
}
h1{
    margin:0;
    font-size:28px;
    line-height:1.1;
}
.tagline{
    margin:6px 0 0;
    color:var(--muted);
    font-size:13px;
    line-height:1.6;
}
.stat-grid{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:10px;
}
.stat{
    border:1px solid #1f3349;
    background:#0b1424;
    padding:10px;
    border-radius:8px;
}
.label{
    color:#8fb2c9;
    font-size:12px;
}
.value{
    margin-top:4px;
    font-size:21px;
    font-weight:700;
}
.meter{
    height:10px;
    border:1px solid #29435b;
    background:#07101d;
    border-radius:999px;
    overflow:hidden;
}
.meter span{
    display:block;
    height:100%;
    width:0%;
    background:linear-gradient(90deg,#22c55e,#facc15,#fb7185);
    box-shadow:0 0 18px #facc15;
    transition:width .12s linear;
}
.list{
    display:grid;
    gap:8px;
    color:#cfe7f6;
    font-size:13px;
    line-height:1.5;
}
.key{
    display:inline-flex;
    align-items:center;
    justify-content:center;
    min-width:26px;
    height:22px;
    padding:0 7px;
    margin-right:6px;
    border:1px solid #45647d;
    border-radius:6px;
    background:#132237;
    color:white;
    font-size:12px;
    font-weight:700;
}
.mode-toggle{
    display:grid;
    grid-template-columns:1fr 1fr;
    gap:6px;
    padding:4px;
    border:1px solid #243c55;
    border-radius:8px;
    background:#07101d;
}
.mode-toggle button{
    min-height:34px;
    border:0;
    border-radius:6px;
    background:transparent;
    color:#a8c2d8;
    font:700 13px "Microsoft YaHei",Arial,sans-serif;
    cursor:pointer;
}
.mode-toggle button.active{
    background:#36d399;
    color:#06131b;
    box-shadow:0 0 18px rgba(54,211,153,.34);
}
.game-wrap{
    min-width:0;
    min-height:0;
    position:relative;
    display:grid;
    place-items:center;
    padding:12px;
}
#gameCanvas{
    width:min(100%,calc((100vh - 60px) * 1.25));
    aspect-ratio:5/4;
    max-height:calc(100vh - 44px);
    border:2px solid #4cc9f0;
    border-radius:8px;
    background:#08111f;
    box-shadow:0 0 0 1px rgba(255,255,255,.05),0 0 32px rgba(56,189,248,.36);
}
.overlay{
    position:absolute;
    inset:12px;
    display:grid;
    place-items:center;
    pointer-events:none;
}
.card{
    width:min(520px,86%);
    border:1px solid #365775;
    background:rgba(7,14,24,.86);
    border-radius:8px;
    padding:22px;
    text-align:center;
    box-shadow:0 18px 70px rgba(0,0,0,.45);
}
.card h2{
    margin:0 0 8px;
    font-size:26px;
}
.card p{
    margin:0;
    color:#c7dceb;
    line-height:1.7;
}
.badge{
    display:inline-flex;
    align-items:center;
    gap:6px;
    min-height:28px;
    padding:5px 10px;
    border:1px solid #385671;
    border-radius:999px;
    background:#101d31;
    color:#dff7ff;
    font-size:12px;
}
.feed{
    min-height:112px;
    display:grid;
    align-content:start;
    gap:8px;
}
.event{
    padding:9px 10px;
    border:1px solid #22364d;
    border-radius:8px;
    background:#0b1424;
    color:#dbeafe;
    font-size:13px;
}
.legend{
    display:grid;
    gap:8px;
}
.legend-row{
    display:flex;
    align-items:center;
    justify-content:space-between;
    gap:10px;
    color:#cfe7f6;
    font-size:13px;
}
.swatch{
    width:18px;
    height:18px;
    border-radius:5px;
    box-shadow:0 0 14px currentColor;
}
@media (max-width:900px){
    body{overflow:auto}
    .shell{
        height:auto;
        min-height:100vh;
        grid-template-columns:1fr;
        padding:12px;
    }
    .side{padding:14px}
    #gameCanvas{
        width:100%;
        max-height:none;
    }
}
</style>
</head>
<body>
<main class="shell">
    <aside class="panel side">
        <div>
            <h1>超级打砖块</h1>
            <p class="tagline">瞄准发球、连击升温、接道具、清砖块。每一关都有新词缀。</p>
        </div>
        <section class="stat-grid" aria-label="游戏数据">
            <div class="stat"><div class="label">得分</div><div class="value" id="score">0</div></div>
            <div class="stat"><div class="label">生命</div><div class="value" id="lives">3</div></div>
            <div class="stat"><div class="label">关卡</div><div class="value" id="level">1</div></div>
            <div class="stat"><div class="label">连击</div><div class="value" id="combo">0</div></div>
        </section>
        <div>
            <div class="label" style="margin-bottom:8px">狂热槽</div>
            <div class="meter"><span id="feverMeter"></span></div>
        </div>
        <section class="list" aria-label="操作">
            <div><span class="key">鼠标</span>移动挡板，发球前移动可瞄准</div>
            <div><span class="key">空格</span>发球 / 激光 / 重新开始</div>
            <div><span class="key">P</span>暂停或继续</div>
            <div><span class="key">触屏</span>拖动挡板，点击开始</div>
        </section>
    </aside>

    <section class="panel game-wrap" aria-label="游戏区域">
        <canvas id="gameCanvas" width="1000" height="800"></canvas>
        <div class="overlay" id="overlay">
            <div class="card">
                <h2 id="overlayTitle">点击开始</h2>
                <p id="overlayText">移动挡板调整瞄准线，空格或点击发球。连击越高，狂热来得越快。</p>
            </div>
        </div>
    </section>

    <aside class="panel side">
        <section>
            <div class="label" style="margin-bottom:8px">玩家模式</div>
            <div class="mode-toggle" role="group" aria-label="玩家模式">
                <button class="active" id="playerModeBtn" type="button">玩家</button>
                <button id="aiModeBtn" type="button">人机</button>
            </div>
        </section>
        <div class="badge" id="modifierBadge">词缀：准备中</div>
        <section>
            <div class="label" style="margin-bottom:10px">砖块和道具</div>
            <div class="legend">
                <div class="legend-row"><span>炸弹砖</span><span class="swatch" style="color:#ef4444;background:#ef4444"></span></div>
                <div class="legend-row"><span>钢铁砖</span><span class="swatch" style="color:#94a3b8;background:#94a3b8"></span></div>
                <div class="legend-row"><span>礼物砖</span><span class="swatch" style="color:#facc15;background:#facc15"></span></div>
                <div class="legend-row"><span>护盾道具</span><span class="swatch" style="color:#22d3ee;background:#22d3ee"></span></div>
            </div>
        </section>
        <section>
            <div class="label" style="margin-bottom:10px">战况</div>
            <div class="feed" id="feed"></div>
        </section>
    </aside>
</main>

<script>
const canvas = document.getElementById("gameCanvas");
const ctx = canvas.getContext("2d");
const overlay = document.getElementById("overlay");
const overlayTitle = document.getElementById("overlayTitle");
const overlayText = document.getElementById("overlayText");
const scoreEl = document.getElementById("score");
const livesEl = document.getElementById("lives");
const levelEl = document.getElementById("level");
const comboEl = document.getElementById("combo");
const feverMeter = document.getElementById("feverMeter");
const modifierBadge = document.getElementById("modifierBadge");
const feed = document.getElementById("feed");
const playerModeBtn = document.getElementById("playerModeBtn");
const aiModeBtn = document.getElementById("aiModeBtn");

const W = canvas.width;
const H = canvas.height;
const maxLevel = 12;
const modifiers = [
    {name:"普通航线", ball:1, gravity:1, drop:1},
    {name:"高速雨", ball:1.14, gravity:1.18, drop:1.2},
    {name:"礼物加班", ball:.98, gravity:.95, drop:1.55},
    {name:"硬核砖墙", ball:1.05, gravity:1, drop:.9},
    {name:"霓虹巡航", ball:1.08, gravity:1.05, drop:1}
];
const powerColors = {
    multi:"#facc15",
    life:"#38bdf8",
    wide:"#36d399",
    laser:"#ef4444",
    shield:"#22d3ee",
    slow:"#a78bfa",
    blast:"#fb7185"
};
const powerLabels = {
    multi:"多球",
    life:"+1",
    wide:"加宽",
    laser:"激光",
    shield:"护盾",
    slow:"慢放",
    blast:"清屏"
};

let audioCtx;
let state;
let pointerX = W / 2;
let controlMode = "player";
let rafId = 0;
let lastTime = 0;
let starSeed = Array.from({length:70}, () => ({
    x:Math.random() * W,
    y:Math.random() * H,
    r:Math.random() * 1.8 + .5,
    a:Math.random() * .5 + .2,
    s:Math.random() * .35 + .05
}));

function makeState() {
    return {
        mode:"ready",
        score:0,
        lives:3,
        level:1,
        combo:0,
        fever:0,
        feverTime:0,
        shake:0,
        messageTimer:0,
        message:"",
        shield:false,
        laserTime:0,
        slowTime:0,
        aiLaunchDelay:0,
        aiLaserCooldown:0,
        aiShotBias:1,
        modifier:modifiers[0],
        paddle:{x:W / 2 - 75, y:H - 42, w:150, h:14, target:W / 2},
        balls:[],
        bricks:[],
        powerUps:[],
        lasers:[],
        particles:[]
    };
}

function initAudio() {
    if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === "suspended") audioCtx.resume();
}

function beep(freq, type = "sine", duration = .07, volume = .06) {
    if (!audioCtx) return;
    const osc = audioCtx.createOscillator();
    const gain = audioCtx.createGain();
    osc.type = type;
    osc.frequency.value = freq;
    gain.gain.value = volume;
    osc.connect(gain);
    gain.connect(audioCtx.destination);
    osc.start();
    gain.gain.exponentialRampToValueAtTime(.0001, audioCtx.currentTime + duration);
    osc.stop(audioCtx.currentTime + duration);
}

function addEvent(text) {
    const item = document.createElement("div");
    item.className = "event";
    item.textContent = text;
    feed.prepend(item);
    while (feed.children.length > 4) feed.lastChild.remove();
}

function showOverlay(title, text) {
    overlayTitle.textContent = title;
    overlayText.textContent = text;
    overlay.style.display = "grid";
}

function hideOverlay() {
    overlay.style.display = "none";
}

function setTemporaryMessage(text, frames = 90) {
    state.message = text;
    state.messageTimer = frames;
}

function syncControlModeButtons() {
    playerModeBtn.classList.toggle("active", controlMode === "player");
    aiModeBtn.classList.toggle("active", controlMode === "ai");
}

function setControlMode(mode) {
    controlMode = mode;
    syncControlModeButtons();
    if (!state) return;
    if (mode === "ai") {
        state.aiLaunchDelay = 18;
        setTemporaryMessage("人机接管");
        addEvent("切换到人机模式。");
        if (state.mode === "ready" || state.mode === "gameover" || state.mode === "win") startGame();
    } else {
        setTemporaryMessage("玩家接管");
        addEvent("切换到玩家模式。");
    }
}

function startGame() {
    initAudio();
    state = makeState();
    feed.innerHTML = "";
    addEvent("第一关上线，先热手。");
    buildLevel();
    hideOverlay();
    state.mode = "aim";
    if (controlMode === "ai") {
        state.aiLaunchDelay = 18;
        setTemporaryMessage("人机接管");
    }
    cancelAnimationFrame(rafId);
    lastTime = performance.now();
    rafId = requestAnimationFrame(loop);
}

function buildLevel() {
    state.modifier = modifiers[(state.level - 1) % modifiers.length];
    modifierBadge.textContent = "词缀：" + state.modifier.name;
    state.balls = [];
    state.bricks = [];
    state.powerUps = [];
    state.lasers = [];
    state.particles = [];
    state.combo = 0;
    state.paddle.w = Math.max(125, Math.min(170, state.paddle.w));
    state.paddle.x = W / 2 - state.paddle.w / 2;
    state.paddle.target = W / 2;
    createBall(true);

    const cols = 14;
    const rows = 6 + Math.min(3, Math.floor((state.level - 1) / 2));
    const gap = 6;
    const bw = Math.floor((W - 140 - gap * (cols - 1)) / cols);
    const bh = 23;
    const ox = (W - cols * bw - (cols - 1) * gap) / 2;
    const oy = 78;
    const rowHues = [0,25,48,145,190,235,275,315,345];
    for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
            const edgeBrick = c === 0 || c === cols - 1;
            const staggerGap = r % 2 === 1 && (c + state.level) % 3 === 0;
            const centerGap = r > 0 && Math.abs(c - (cols - 1) / 2) < 2.2 && (r + state.level) % 2 !== 0;
            const diagonalGap = r > 1 && (c + r + state.level) % 5 === 0;
            const pocketGap = r > 2 && (c - r + state.level) % 6 === 0;
            if (!edgeBrick && (staggerGap || centerGap || diagonalGap || pocketGap)) continue;
            let type = "normal";
            let hp = 1;
            const roll = Math.random();
            if (roll < .045 + state.level * .004) type = "bomb";
            else if (roll < .18 + state.level * .01) { type = "hard"; hp = state.modifier.name === "硬核砖墙" ? 4 : 3; }
            else if (roll < .27 + state.modifier.drop * .025) type = "gift";
            state.bricks.push({
                x:ox + c * (bw + gap),
                y:oy + r * (bh + gap),
                w:bw,
                h:bh,
                hp,
                maxHp:hp,
                type,
                alive:true,
                hue:(rowHues[r % rowHues.length] + state.level * 4) % 360
            });
        }
    }
}

function createBall(stuck = false, source) {
    const angle = source ? Math.atan2(source.dy, source.dx) + (Math.random() - .5) * .85 : -Math.PI / 2;
    const speed = (5.2 + Math.min(2.5, state.level * .25)) * state.modifier.ball;
    const ball = {
        x:source ? source.x : state.paddle.x + state.paddle.w / 2,
        y:source ? source.y : state.paddle.y - 14,
        dx:Math.cos(angle) * speed,
        dy:Math.sin(angle) * speed,
        r:9,
        stuck,
        trail:[]
    };
    if (stuck) {
        ball.dx = 0;
        ball.dy = -speed;
    }
    state.balls.push(ball);
    return ball;
}

function launchBalls() {
    if (state.mode === "ready") return;
    let launched = false;
    const aim = getAim();
    state.balls.forEach(ball => {
        if (!ball.stuck) return;
        const speed = (5.8 + Math.min(2.8, state.level * .3)) * state.modifier.ball;
        ball.dx = Math.cos(aim) * speed;
        ball.dy = Math.sin(aim) * speed;
        ball.stuck = false;
        launched = true;
    });
    if (!launched) return;
    state.mode = "playing";
    beep(540, "triangle", .08);
}

function getAim() {
    const center = state.paddle.x + state.paddle.w / 2;
    const offset = Math.max(-1, Math.min(1, (pointerX - center) / 180));
    return -Math.PI / 2 + offset * .85;
}

function pauseGame() {
    if (!state || state.mode === "ready" || state.mode === "gameover" || state.mode === "win") return;
    if (state.mode === "paused") {
        state.mode = state.balls.some(b => b.stuck) ? "aim" : "playing";
        hideOverlay();
        lastTime = performance.now();
        rafId = requestAnimationFrame(loop);
    } else {
        state.mode = "paused";
        showOverlay("已暂停", "按 P 继续。局面已经停住，可以喘口气。");
        cancelAnimationFrame(rafId);
    }
}

function spawnParticles(x, y, color, count = 16, power = 1) {
    for (let i = 0; i < count; i++) {
        const a = Math.random() * Math.PI * 2;
        const s = (Math.random() * 4 + 1.5) * power;
        state.particles.push({
            x, y,
            dx:Math.cos(a) * s,
            dy:Math.sin(a) * s,
            life:28 + Math.random() * 28,
            color,
            size:Math.random() * 3 + 2
        });
    }
}

function brickColor(brick) {
    if (brick.type === "bomb") return "#ef4444";
    if (brick.type === "hard") return "#94a3b8";
    if (brick.type === "gift") return "#facc15";
    return `hsl(${brick.hue},82%,58%)`;
}

function damageBrick(brick, amount = 1) {
    if (!brick.alive) return;
    brick.hp -= amount;
    if (brick.hp > 0) {
        beep(150, "square", .04, .04);
        return;
    }
    brick.alive = false;
    const gain = 12 + state.combo * 2;
    state.score += state.feverTime > 0 ? gain * 2 : gain;
    state.combo += 1;
    state.fever = Math.min(100, state.fever + 5 + Math.min(8, state.combo / 3));
    spawnParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, brickColor(brick), 18);
    beep(240 + Math.random() * 360, "triangle", .06);

    if (state.combo === 8) setTemporaryMessage("8 连击，开始热了！");
    if (state.combo === 18) setTemporaryMessage("18 连击，狂热马上来！");
    if (state.fever >= 100 && state.feverTime <= 0) {
        state.fever = 0;
        state.feverTime = 520;
        setTemporaryMessage("狂热模式：双倍分数！");
        addEvent("狂热模式启动，得分翻倍。");
        beep(760, "sawtooth", .14, .08);
    }

    if (brick.type === "bomb") explodeAround(brick);
    if (brick.type === "gift" || Math.random() < .17 * state.modifier.drop) spawnPower(brick.x + brick.w / 2, brick.y + brick.h / 2);
}

function explodeAround(origin) {
    state.shake = 18;
    beep(80, "sawtooth", .18, .1);
    for (const brick of state.bricks) {
        if (!brick.alive || brick === origin) continue;
        const dx = brick.x + brick.w / 2 - (origin.x + origin.w / 2);
        const dy = brick.y + brick.h / 2 - (origin.y + origin.h / 2);
        if (Math.hypot(dx, dy) < 85) {
            brick.alive = false;
            state.score += 18;
            spawnParticles(brick.x + brick.w / 2, brick.y + brick.h / 2, brickColor(brick), 10);
        }
    }
}

function spawnPower(x, y) {
    const types = ["multi","life","wide","laser","shield","slow","blast"];
    const weights = [42,10,16,16,12,10,7];
    let total = weights.reduce((a,b) => a + b, 0);
    let pick = Math.random() * total;
    let type = "multi";
    for (let i = 0; i < types.length; i++) {
        pick -= weights[i];
        if (pick <= 0) { type = types[i]; break; }
    }
    state.powerUps.push({x, y, type, vy:2.4 * state.modifier.gravity, spin:0});
}

function applyPower(type) {
    beep(620, "sine", .08);
    addEvent("获得道具：" + powerLabels[type]);
    if (type === "multi") {
        const active = state.balls.filter(b => !b.stuck).slice(0, 8);
        if (active.length === 0) active.push(...state.balls.slice(0, 1));
        active.forEach(ball => createBall(false, ball));
        setTemporaryMessage("多球乱斗！");
    }
    if (type === "life") state.lives += 1;
    if (type === "wide") {
        state.paddle.w = Math.min(260, state.paddle.w + 42);
        setTimeout(() => { if (state) state.paddle.w = Math.max(130, state.paddle.w - 34); }, 9500);
    }
    if (type === "laser") {
        state.laserTime = 520;
        setTemporaryMessage("激光就绪，按空格发射。");
    }
    if (type === "shield") {
        state.shield = true;
        setTemporaryMessage("底部护盾已展开。");
    }
    if (type === "slow") {
        state.slowTime = 420;
        setTemporaryMessage("慢放时间，稳稳接球。");
    }
    if (type === "blast") {
        const targets = state.bricks.filter(b => b.alive).slice(0, 18);
        targets.forEach(b => damageBrick(b, 99));
        state.shake = 24;
    }
}

function fireLaser() {
    if (state.laserTime <= 0) return;
    state.lasers.push({x:state.paddle.x + 14, y:state.paddle.y - 10});
    state.lasers.push({x:state.paddle.x + state.paddle.w - 18, y:state.paddle.y - 10});
    beep(840, "square", .04, .04);
}

function levelCleared() {
    return state.bricks.every(b => !b.alive);
}

function prepareRespawnBall() {
    state.balls = [];
    createBall(true);
    state.mode = "aim";
    state.lasers = [];
}

function nextLevel() {
    state.level += 1;
    if (state.level > maxLevel) {
        state.mode = "win";
        showOverlay("通关成功", `最终得分 ${state.score}。按空格或点击再来一局。`);
        addEvent("十二关全清，漂亮。");
        return;
    }
    addEvent(`第 ${state.level} 关：${modifiers[(state.level - 1) % modifiers.length].name}`);
    buildLevel();
    state.mode = "aim";
    setTemporaryMessage(`第 ${state.level} 关`);
}

function loseLife() {
    if (state.shield) {
        state.shield = false;
        prepareRespawnBall();
        setTemporaryMessage("护盾救了一球。");
        beep(520, "triangle", .15);
        return;
    }
    state.lives -= 1;
    state.combo = 0;
    beep(95, "sawtooth", .2);
    if (state.lives <= 0) {
        state.mode = "gameover";
        showOverlay("游戏结束", `得分 ${state.score}。按空格或点击重新开始。`);
        return;
    }
    prepareRespawnBall();
    setTemporaryMessage("掉球了，重新瞄准。");
}

function clamp(value, min, max) {
    return Math.max(min, Math.min(max, value));
}

function predictLandingX(ball) {
    if (ball.stuck || ball.dy <= .05) return null;
    const p = state.paddle;
    const steps = (p.y - ball.y) / ball.dy;
    if (steps <= 0) return null;
    const minX = ball.r;
    const maxX = W - ball.r;
    const span = maxX - minX;
    let x = ball.x + ball.dx * steps;
    let offset = (x - minX) % (span * 2);
    if (offset < 0) offset += span * 2;
    return offset <= span ? minX + offset : maxX - (offset - span);
}

function chooseAiShotBias() {
    const alive = state.bricks.filter(brick => brick.alive);
    if (alive.length === 0) return state.aiShotBias || 1;
    const focusX = alive.reduce((sum, brick) => {
        const rowWeight = 1 + (H - brick.y) / H;
        return sum + (brick.x + brick.w / 2) * rowWeight;
    }, 0) / alive.reduce((sum, brick) => sum + 1 + (H - brick.y) / H, 0);
    if (Math.abs(focusX - W / 2) >= 85) state.aiShotBias = focusX < W / 2 ? -1 : 1;
    return state.aiShotBias;
}

function chooseAiTarget() {
    const p = state.paddle;
    const center = p.x + p.w / 2;
    if (state.mode === "aim") {
        const alive = state.bricks.filter(brick => brick.alive);
        if (alive.length === 0) return W / 2;
        const target = alive.reduce((best, brick) => {
            const score = brick.y + Math.abs((brick.x + brick.w / 2) - W / 2) * .18;
            return score < best.score ? {brick, score} : best;
        }, {brick:alive[0], score:Infinity}).brick;
        return clamp(target.x + target.w / 2, 90, W - 90);
    }

    let targetX = W / 2;
    let urgency = Infinity;
    let targetLandingX = null;
    for (const ball of state.balls) {
        const landingX = predictLandingX(ball);
        if (landingX === null) continue;
        const steps = (p.y - ball.y) / ball.dy;
        if (steps < urgency) {
            urgency = steps;
            targetLandingX = landingX;
        }
    }

    if (targetLandingX !== null) {
        const hitBias = chooseAiShotBias() * .58;
        targetX = targetLandingX - hitBias * (p.w / 2);
    }

    const catchableDrop = state.powerUps
        .filter(pu => pu.y < p.y && pu.y > H * .34)
        .sort((a, b) => b.y - a.y)[0];
    if (catchableDrop && (urgency > 90 || Math.abs(catchableDrop.x - targetX) < p.w * .45)) {
        targetX = catchableDrop.x;
    } else if (urgency === Infinity) {
        const activeBall = state.balls.find(ball => !ball.stuck);
        targetX = activeBall ? activeBall.x : center;
    }

    return clamp(targetX, p.w / 2, W - p.w / 2);
}

function updateAiController(dt) {
    if (controlMode !== "ai" || state.mode === "paused") return;
    pointerX = chooseAiTarget();
    state.aiLaunchDelay = Math.max(0, state.aiLaunchDelay - dt * 60);
    state.aiLaserCooldown = Math.max(0, state.aiLaserCooldown - dt * 60);
    if (state.mode === "aim" && state.aiLaunchDelay <= 0) {
        const p = state.paddle;
        pointerX = clamp(p.x + p.w / 2 + chooseAiShotBias() * 145, 0, W);
        launchBalls();
        state.aiLaunchDelay = 24;
    }
    if (state.mode === "playing" && state.laserTime > 0 && state.aiLaserCooldown <= 0) {
        fireLaser();
        state.aiLaserCooldown = 18;
    }
}

function update(dt) {
    updateAiController(dt);
    const p = state.paddle;
    p.target = pointerX;
    p.x += (p.target - (p.x + p.w / 2)) * Math.min(1, dt * 13);
    p.x = Math.max(0, Math.min(W - p.w, p.x));

    if (state.mode === "aim") {
        state.balls.forEach(ball => {
            if (ball.stuck) {
                ball.x = p.x + p.w / 2;
                ball.y = p.y - ball.r - 1;
            }
        });
    }

    const slow = state.slowTime > 0 ? .58 : 1;
    const speedScale = state.feverTime > 0 ? 1.08 : 1;
    for (const ball of state.balls) {
        if (ball.stuck) continue;
        ball.trail.push({x:ball.x, y:ball.y});
        if (ball.trail.length > 11) ball.trail.shift();
        ball.x += ball.dx * dt * 60 * slow * speedScale;
        ball.y += ball.dy * dt * 60 * slow * speedScale;
        if (ball.x < ball.r) { ball.x = ball.r; ball.dx = Math.abs(ball.dx); beep(250); }
        if (ball.x > W - ball.r) { ball.x = W - ball.r; ball.dx = -Math.abs(ball.dx); beep(250); }
        if (ball.y < ball.r) { ball.y = ball.r; ball.dy = Math.abs(ball.dy); beep(250); }
        if (ball.y > H + 40) ball.dead = true;

        if (ball.y + ball.r >= p.y && ball.y - ball.r <= p.y + p.h && ball.x >= p.x && ball.x <= p.x + p.w && ball.dy > 0) {
            const hit = (ball.x - (p.x + p.w / 2)) / (p.w / 2);
            const speed = Math.min(9.2, Math.hypot(ball.dx, ball.dy) + .13);
            ball.dx = hit * 6.4;
            ball.dy = -Math.sqrt(Math.max(10, speed * speed - ball.dx * ball.dx));
            ball.y = p.y - ball.r - 1;
            beep(360, "triangle", .05);
        }

        for (const brick of state.bricks) {
            if (!brick.alive) continue;
            if (ball.x + ball.r > brick.x && ball.x - ball.r < brick.x + brick.w && ball.y + ball.r > brick.y && ball.y - ball.r < brick.y + brick.h) {
                const prevX = ball.x - ball.dx * dt * 60;
                const fromSide = prevX <= brick.x || prevX >= brick.x + brick.w;
                if (fromSide) ball.dx *= -1;
                else ball.dy *= -1;
                damageBrick(brick);
                break;
            }
        }
    }
    state.balls = state.balls.filter(b => !b.dead);
    if (state.balls.length === 0 && (state.mode === "playing" || state.mode === "aim")) loseLife();

    for (let i = state.powerUps.length - 1; i >= 0; i--) {
        const pu = state.powerUps[i];
        pu.y += pu.vy * dt * 60;
        pu.spin += dt * 7;
        if (pu.y + 12 >= p.y && pu.x >= p.x && pu.x <= p.x + p.w) {
            applyPower(pu.type);
            spawnParticles(pu.x, pu.y, powerColors[pu.type], 20);
            state.powerUps.splice(i, 1);
        } else if (pu.y > H + 30) state.powerUps.splice(i, 1);
    }

    for (let i = state.lasers.length - 1; i >= 0; i--) {
        const l = state.lasers[i];
        l.y -= 820 * dt;
        for (const brick of state.bricks) {
            if (!brick.alive) continue;
            if (l.x > brick.x && l.x < brick.x + brick.w && l.y > brick.y && l.y < brick.y + brick.h) {
                damageBrick(brick);
                l.dead = true;
                break;
            }
        }
        if (l.y < -30 || l.dead) state.lasers.splice(i, 1);
    }

    for (let i = state.particles.length - 1; i >= 0; i--) {
        const part = state.particles[i];
        part.x += part.dx * dt * 60;
        part.y += part.dy * dt * 60;
        part.dy += .04 * dt * 60;
        part.life -= dt * 60;
        if (part.life <= 0) state.particles.splice(i, 1);
    }

    if (state.laserTime > 0) state.laserTime -= dt * 60;
    if (state.slowTime > 0) state.slowTime -= dt * 60;
    if (state.feverTime > 0) state.feverTime -= dt * 60;
    if (state.messageTimer > 0) state.messageTimer -= dt * 60;
    if (state.shake > 0) state.shake -= dt * 60;

    if (levelCleared() && state.mode !== "gameover" && state.mode !== "win") nextLevel();
}

function drawBackground(time) {
    const bg = ctx.createLinearGradient(0, 0, W, H);
    bg.addColorStop(0, "#08111f");
    bg.addColorStop(.55, state.feverTime > 0 ? "#24142b" : "#101827");
    bg.addColorStop(1, "#06131b");
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
    for (const star of starSeed) {
        star.y += star.s;
        if (star.y > H) star.y = 0;
        const twinkle = .5 + Math.sin(time * .002 + star.x) * .35;
        ctx.globalAlpha = star.a * twinkle;
        ctx.fillStyle = "#bfefff";
        ctx.beginPath();
        ctx.arc(star.x, star.y, star.r, 0, Math.PI * 2);
        ctx.fill();
    }
    ctx.globalAlpha = 1;
}

function roundedRect(x, y, w, h, r) {
    ctx.beginPath();
    ctx.moveTo(x + r, y);
    ctx.lineTo(x + w - r, y);
    ctx.quadraticCurveTo(x + w, y, x + w, y + r);
    ctx.lineTo(x + w, y + h - r);
    ctx.quadraticCurveTo(x + w, y + h, x + w - r, y + h);
    ctx.lineTo(x + r, y + h);
    ctx.quadraticCurveTo(x, y + h, x, y + h - r);
    ctx.lineTo(x, y + r);
    ctx.quadraticCurveTo(x, y, x + r, y);
    ctx.closePath();
}

function drawBricks() {
    for (const brick of state.bricks) {
        if (!brick.alive) continue;
        const color = brickColor(brick);
        ctx.save();
        ctx.shadowColor = color;
        ctx.shadowBlur = 10;
        ctx.fillStyle = color;
        roundedRect(brick.x, brick.y, brick.w, brick.h, 6);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "rgba(255,255,255,.22)";
        roundedRect(brick.x + 5, brick.y + 4, brick.w - 10, Math.max(4, brick.h * .18), 4);
        ctx.fill();
        if (brick.type === "hard") {
            ctx.fillStyle = "#08111f";
            ctx.fillRect(brick.x + 10, brick.y + brick.h - 12, brick.w - 20, 6);
            ctx.fillStyle = "#36d399";
            ctx.fillRect(brick.x + 10, brick.y + brick.h - 12, (brick.w - 20) * (brick.hp / brick.maxHp), 6);
        }
        if (brick.type === "bomb" || brick.type === "gift") {
            ctx.fillStyle = brick.type === "gift" ? "#111827" : "white";
            ctx.font = "700 15px Arial";
            ctx.textAlign = "center";
            ctx.textBaseline = "middle";
            ctx.fillText(brick.type === "bomb" ? "!" : "*", brick.x + brick.w / 2, brick.y + brick.h / 2 - 1);
            ctx.textAlign = "left";
            ctx.textBaseline = "alphabetic";
        }
        ctx.restore();
    }
}

function drawPaddle() {
    const p = state.paddle;
    const grad = ctx.createLinearGradient(p.x, p.y, p.x + p.w, p.y);
    grad.addColorStop(0, "#22c55e");
    grad.addColorStop(.5, state.laserTime > 0 ? "#ef4444" : "#bbf7d0");
    grad.addColorStop(1, "#22c55e");
    ctx.save();
    ctx.shadowColor = state.laserTime > 0 ? "#ef4444" : "#36d399";
    ctx.shadowBlur = 18;
    ctx.fillStyle = grad;
    roundedRect(p.x, p.y, p.w, p.h, 8);
    ctx.fill();
    ctx.shadowBlur = 0;
    if (state.shield) {
        ctx.fillStyle = "rgba(34,211,238,.45)";
        ctx.fillRect(0, H - 8, W, 8);
    }
    ctx.restore();
}

function drawAim() {
    if (state.mode !== "aim") return;
    const angle = getAim();
    const x = state.paddle.x + state.paddle.w / 2;
    const y = state.paddle.y - 14;
    ctx.save();
    ctx.setLineDash([10, 9]);
    ctx.strokeStyle = "rgba(250,204,21,.78)";
    ctx.lineWidth = 3;
    ctx.beginPath();
    ctx.moveTo(x, y);
    ctx.lineTo(x + Math.cos(angle) * 150, y + Math.sin(angle) * 150);
    ctx.stroke();
    ctx.setLineDash([]);
    ctx.restore();
}

function drawBalls() {
    for (const ball of state.balls) {
        ball.trail.forEach((pt, i) => {
            ctx.globalAlpha = i / ball.trail.length * .5;
            ctx.fillStyle = "#fb7185";
            ctx.beginPath();
            ctx.arc(pt.x, pt.y, ball.r * i / ball.trail.length, 0, Math.PI * 2);
            ctx.fill();
        });
        ctx.globalAlpha = 1;
        ctx.save();
        ctx.shadowColor = "#fb7185";
        ctx.shadowBlur = 16;
        ctx.fillStyle = state.feverTime > 0 ? "#facc15" : "#fb7185";
        ctx.beginPath();
        ctx.arc(ball.x, ball.y, ball.r, 0, Math.PI * 2);
        ctx.fill();
        ctx.restore();
    }
}

function drawDrops() {
    for (const pu of state.powerUps) {
        ctx.save();
        ctx.translate(pu.x, pu.y);
        ctx.rotate(pu.spin);
        ctx.shadowColor = powerColors[pu.type];
        ctx.shadowBlur = 14;
        ctx.fillStyle = powerColors[pu.type];
        roundedRect(-16, -16, 32, 32, 7);
        ctx.fill();
        ctx.shadowBlur = 0;
        ctx.fillStyle = "#07111f";
        ctx.font = "700 11px Arial";
        ctx.textAlign = "center";
        ctx.textBaseline = "middle";
        ctx.fillText(powerLabels[pu.type], 0, 1);
        ctx.restore();
    }
}

function drawLasers() {
    ctx.save();
    ctx.shadowColor = "#ef4444";
    ctx.shadowBlur = 16;
    ctx.fillStyle = "#ef4444";
    state.lasers.forEach(l => ctx.fillRect(l.x - 2, l.y - 22, 4, 28));
    ctx.restore();
}

function drawParticles() {
    for (const part of state.particles) {
        ctx.globalAlpha = Math.max(0, part.life / 56);
        ctx.fillStyle = part.color;
        ctx.fillRect(part.x, part.y, part.size, part.size);
    }
    ctx.globalAlpha = 1;
}

function drawHud() {
    if (state.messageTimer > 0) {
        ctx.save();
        ctx.textAlign = "center";
        ctx.fillStyle = "rgba(6,13,24,.68)";
        roundedRect(W / 2 - 210, 22, 420, 46, 8);
        ctx.fill();
        ctx.fillStyle = "#fff7cc";
        ctx.font = "700 24px Microsoft YaHei, Arial";
        ctx.fillText(state.message, W / 2, 53);
        ctx.restore();
    }
    if (state.feverTime > 0) {
        ctx.save();
        ctx.strokeStyle = "rgba(250,204,21,.8)";
        ctx.lineWidth = 8;
        ctx.strokeRect(8, 8, W - 16, H - 16);
        ctx.restore();
    }
}

function render(time) {
    ctx.save();
    if (state.shake > 0) ctx.translate((Math.random() - .5) * 10, (Math.random() - .5) * 10);
    drawBackground(time);
    drawBricks();
    drawAim();
    drawBalls();
    drawPaddle();
    drawDrops();
    drawLasers();
    drawParticles();
    drawHud();
    ctx.restore();
}

function syncStats() {
    scoreEl.textContent = Math.floor(state.score);
    livesEl.textContent = state.lives;
    levelEl.textContent = state.level + "/" + maxLevel;
    comboEl.textContent = state.combo;
    feverMeter.style.width = (state.feverTime > 0 ? 100 : state.fever) + "%";
}

function loop(now) {
    const dt = Math.min(.033, (now - lastTime) / 1000 || .016);
    lastTime = now;
    if (state.mode === "playing" || state.mode === "aim") update(dt);
    render(now);
    syncStats();
    if (state.mode !== "paused" && state.mode !== "gameover" && state.mode !== "win") rafId = requestAnimationFrame(loop);
}

function setPointer(clientX) {
    const rect = canvas.getBoundingClientRect();
    const ratio = W / rect.width;
    pointerX = Math.max(0, Math.min(W, (clientX - rect.left) * ratio));
}

document.addEventListener("mousemove", e => {
    if (controlMode === "player") setPointer(e.clientX);
});
canvas.addEventListener("pointermove", e => {
    if (controlMode === "player") setPointer(e.clientX);
});
canvas.addEventListener("pointerdown", e => {
    if (controlMode === "player") setPointer(e.clientX);
    if (!state || state.mode === "ready" || state.mode === "gameover" || state.mode === "win") startGame();
    else if (controlMode === "player" && state.mode === "aim") launchBalls();
});
document.addEventListener("keydown", e => {
    if (e.code === "Space") {
        e.preventDefault();
        if (!state || state.mode === "ready" || state.mode === "gameover" || state.mode === "win") startGame();
        else if (controlMode === "player" && (state.mode === "aim" || state.balls.some(ball => ball.stuck))) launchBalls();
        else if (controlMode === "player" && state.mode === "playing") fireLaser();
    }
    if (e.code === "KeyP") pauseGame();
});
playerModeBtn.addEventListener("click", () => setControlMode("player"));
aiModeBtn.addEventListener("click", () => setControlMode("ai"));

state = makeState();
syncControlModeButtons();
buildLevel();
render(performance.now());
syncStats();
</script>
</body>
</html>
